name: Android checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: python3 -m unittest discover -s tools/tests -v
      - run: ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebugAndroidTest --stacktrace
      - run: python3 tools/check_apk_abi.py app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-check-results
          path: |
            app/build/reports/
            app/build/outputs/mapping/
            app/build/test-results/
      # Debug artifacts are for testing only and are never published as Releases.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FCMGuard-debug-testing-only
          path: app/build/outputs/apk/debug/app-debug.apk

  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '37.2'
            image-api: '37.0'
            target: aosp_atd
            ram: 3072M
          - api: '37.2'
            image-api: '37.0'
            target: google_apis
            ram: 4096M
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Use the pinned SDK tools for AVD creation
        run: |
          test -f "$ANDROID_HOME/cmdline-tools/16111833/source.properties"
          if [ -e "$ANDROID_HOME/cmdline-tools/latest" ]; then
            mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/fcmguard-preinstalled"
          fi
          ln -s "$ANDROID_HOME/cmdline-tools/16111833" "$ANDROID_HOME/cmdline-tools/latest"
          cat "$ANDROID_HOME/cmdline-tools/latest/source.properties"
      - run: adb start-server
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          FCMGUARD_TEST_QUICK_SETTINGS: ${{ matrix.target != 'aosp_atd' }}
          FCMGUARD_REQUIRE_64BIT: 'true'
        with:
          api-level: ${{ matrix.api }}
          system-image-api-level: ${{ matrix.image-api || matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: ${{ matrix.ram }}
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -feature GLDirectMem,-Vulkan -partition-size 4096
          pre-emulator-launch-script: grep -Fx 'target=android-37.0' "$ANDROID_AVD_HOME/test.ini"
          script: bash tools/run_device_checks.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: emulator-${{ matrix.api }}-${{ matrix.target }}-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            artifacts/screenshots/
            artifacts/emulator-crash.log
            artifacts/shell-settings.log
            artifacts/release-helper.log
            artifacts/shizuku-release-smoke.log
            artifacts/shizuku-release-ui.xml
            artifacts/quick-settings-smoke.log
            artifacts/gms-connection-smoke.log
            artifacts/launcher-shortcut-smoke.log
            artifacts/launcher-shortcut-ui.xml
