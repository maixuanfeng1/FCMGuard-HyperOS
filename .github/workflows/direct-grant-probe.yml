name: Direct grant proof

on:
  push:
    branches: [feature/direct-gms-grant]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: direct-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Use the pinned SDK tools for AVD creation
        run: |
          test -f "$ANDROID_HOME/cmdline-tools/16111833/source.properties"
          if [ -e "$ANDROID_HOME/cmdline-tools/latest" ]; then
            mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/fcmguard-preinstalled"
          fi
          ln -s "$ANDROID_HOME/cmdline-tools/16111833" "$ANDROID_HOME/cmdline-tools/latest"
          cat "$ANDROID_HOME/cmdline-tools/latest/source.properties"
      - run: adb start-server
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          FCMGUARD_TEST_QUICK_SETTINGS: true
          FCMGUARD_REQUIRE_64BIT: 'true'
        with:
          api-level: '37.2'
          system-image-api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -feature GLDirectMem,-Vulkan -partition-size 4096
          pre-emulator-launch-script: grep -Fx 'target=android-37.0' "$ANDROID_AVD_HOME/test.ini"
          script: python3 tools/direct_grant_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: direct-grant-proof
          path: artifacts/direct-grant*
