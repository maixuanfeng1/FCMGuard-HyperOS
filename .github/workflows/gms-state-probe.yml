name: Investigate Android 17 GMS service state
on:
  push:
    branches: [investigation/gms-service-state]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e "$ANDROID_HOME/cmdline-tools/latest" ]; then mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/fcmguard-preinstalled"; fi
          ln -s "$ANDROID_HOME/cmdline-tools/16111833" "$ANDROID_HOME/cmdline-tools/latest"
          adb start-server
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.2'
          system-image-api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -feature GLDirectMem,-Vulkan -partition-size 4096
          pre-emulator-launch-script: grep -Fx 'target=android-37.0' "$ANDROID_AVD_HOME/test.ini"
          script: python3 tools/probe_gms_state.py
