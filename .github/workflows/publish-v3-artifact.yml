name: Publish verified v3.2.0 APK

on:
  push:
    branches: [release/v3.2.0-assets]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;37.0.0'
      - name: Require passing device checks for the exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHECK_RUN=$(gh run list --workflow build-apk.yml --commit 996ec09237186467cbc985b9e44da355ce31a625 --status success --limit 20 --json databaseId --jq '.[0].databaseId // empty')
          test -n "$CHECK_RUN" || { echo 'Exact source checks have not passed.' >&2; exit 1; }
      - name: Verify exact signed release artifact
        working-directory: release-assets/v3.2.0
        run: |
          echo '009339c67819ed058b008bcc65a685772e6be19d1372c521c57456bb8b2f328c  FCMGuard-HyperOS.apk' | sha256sum --check
          python3 ../../tools/check_apk_abi.py FCMGuard-HyperOS.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs FCMGuard-HyperOS.apk | tee certificate.txt
          grep -F 'c61a0648bfc46534632dc1bc03f1a3379d4ea133c3d5236ac4e31dd92b5b1836' certificate.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging FCMGuard-HyperOS.apk > package.txt
          grep -F "versionName='3.2.0'" package.txt
          unzip -p FCMGuard-HyperOS.apk META-INF/version-control-info.textproto | grep -F 996ec09237186467cbc985b9e44da355ce31a625
          grep -F "versionCode='42'" package.txt
          grep -F "targetSdkVersion:'37'" package.txt
          if grep -q 'application-debuggable' package.txt; then
            echo 'Refusing to publish a debuggable APK' >&2
            exit 1
          fi
      - name: Publish single signed APK
        working-directory: release-assets/v3.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.2.0 FCMGuard-HyperOS.apk \
            --target 996ec09237186467cbc985b9e44da355ce31a625 \
            --title 'FCM Guard v3.2.0 · APK 瘦身与列表优化' \
            --notes-file notes.md --latest
