name: Publish verified v3.1.0 APK

on:
  push:
    branches: [release/v3.1.0-assets]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;37.0.0'
      - name: Verify exact signed release artifact
        working-directory: release-assets/v3.1.0
        run: |
          echo '789fb37e0c50e1304584a2faaa47c929e0720ca2696227c5ce49b6bf975dc313  FCMGuard-HyperOS.apk' | sha256sum --check
          python3 ../../tools/check_apk_abi.py FCMGuard-HyperOS.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs FCMGuard-HyperOS.apk | tee certificate.txt
          grep -F 'c61a0648bfc46534632dc1bc03f1a3379d4ea133c3d5236ac4e31dd92b5b1836' certificate.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging FCMGuard-HyperOS.apk > package.txt
          grep -F "versionName='3.1.0'" package.txt
          unzip -p FCMGuard-HyperOS.apk META-INF/version-control-info.textproto | grep -F 89f616729ad1888dd1fc86453bf30f3a76d2f971
          grep -F "versionCode='38'" package.txt
          grep -F "targetSdkVersion:'37'" package.txt
          if grep -q 'application-debuggable' package.txt; then
            echo 'Refusing to publish a debuggable APK' >&2
            exit 1
          fi
      - name: Publish single signed APK
        working-directory: release-assets/v3.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.1.0 FCMGuard-HyperOS.apk \
            --target 89f616729ad1888dd1fc86453bf30f3a76d2f971 \
            --title 'FCM Guard v3.1.0 · FCM 连接状态磁贴' \
            --notes-file notes.md --latest
