name: Publish verified v3.1.3 APK

on:
  push:
    branches: [release/v3.1.3-assets]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;37.0.0'
      - name: Verify exact signed release artifact
        working-directory: release-assets/v3.1.3
        run: |
          echo '5728327277bbe830b31dce397d9d7822a2af1c0d9972496a111de903ef8e1d7a  FCMGuard-HyperOS.apk' | sha256sum --check
          python3 ../../tools/check_apk_abi.py FCMGuard-HyperOS.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs FCMGuard-HyperOS.apk | tee certificate.txt
          grep -F 'c61a0648bfc46534632dc1bc03f1a3379d4ea133c3d5236ac4e31dd92b5b1836' certificate.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging FCMGuard-HyperOS.apk > package.txt
          grep -F "versionName='3.1.3'" package.txt
          unzip -p FCMGuard-HyperOS.apk META-INF/version-control-info.textproto | grep -F a1eb5468d24b3d0087272e780eeb0e836636f519
          grep -F "versionCode='41'" package.txt
          grep -F "targetSdkVersion:'37'" package.txt
          if grep -q 'application-debuggable' package.txt; then
            echo 'Refusing to publish a debuggable APK' >&2
            exit 1
          fi
      - name: Publish single signed APK
        working-directory: release-assets/v3.1.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.1.3 FCMGuard-HyperOS.apk \
            --target a1eb5468d24b3d0087272e780eeb0e836636f519 \
            --title 'FCM Guard v3.1.3 · 桌面长按直达 FCM 诊断' \
            --notes-file notes.md --latest
