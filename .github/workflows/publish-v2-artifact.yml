name: Publish verified v2.4.0 APK

on:
  push:
    branches: [release/v2.4.0-assets]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;37.0.0'
      - name: Verify exact signed release artifact
        working-directory: release-assets/v2.4.0
        run: |
          cp FCMGuard-HyperOS.apk FCMGuard-HyperOS-v2.4.0.apk
          sha256sum --check SHA256SUMS.txt
          python3 ../../tools/check_apk_abi.py FCMGuard-HyperOS.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs FCMGuard-HyperOS.apk | tee certificate.txt
          grep -F 'c61a0648bfc46534632dc1bc03f1a3379d4ea133c3d5236ac4e31dd92b5b1836' certificate.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging FCMGuard-HyperOS.apk > package.txt
          grep -F "versionName='2.4.0'" package.txt
          unzip -p FCMGuard-HyperOS.apk META-INF/version-control-info.textproto | grep -F d181ae8ce9c0ea3829377063205bb2c9b7d51d55
          grep -F "versionCode='35'" package.txt
          grep -F "targetSdkVersion:'37'" package.txt
          if grep -q 'application-debuggable' package.txt; then
            echo 'Refusing to publish a debuggable APK' >&2
            exit 1
          fi
      - name: Publish signed APKs and checksums
        working-directory: release-assets/v2.4.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4.0 FCMGuard-HyperOS.apk FCMGuard-HyperOS-v2.4.0.apk SHA256SUMS.txt UI-light.png UI-dark.png UI-advanced-light.png UI-advanced-dark.png \
            --target d181ae8ce9c0ea3829377063205bb2c9b7d51d55 \
            --title 'FCM Guard v2.4.0 · 首页诊断、工具链升级与64位验证' \
            --notes-file notes.md --latest
