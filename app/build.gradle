plugins {
    id 'com.android.application'
}

android {
    namespace 'com.reed.fcmguard'
    compileSdk {
        version = release(37) { minorApiLevel = 2 }
    }
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId "com.reed.fcmguard"
        minSdk 24
        targetSdk 37
        versionCode 42
        versionName "3.2.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (System.getenv('FCMGUARD_KEYSTORE')) {
                storeFile file(System.getenv('FCMGUARD_KEYSTORE'))
                storePassword System.getenv('FCMGUARD_STORE_PASSWORD')
                keyAlias System.getenv('FCMGUARD_KEY_ALIAS')
                keyPassword System.getenv('FCMGUARD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('FCMGUARD_KEYSTORE')) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencyLocking {
    lockMode = LockMode.STRICT
}
// Lock application/test classpaths, not AGP's lazily created device-test tool configurations.
configurations.configureEach {
    if (name.matches('(debug|release)(AndroidTest|UnitTest)?(CompileClasspath|RuntimeClasspath|AnnotationProcessorClasspath)')) {
        resolutionStrategy.activateDependencyLocking()
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    compileOnly 'androidx.annotation:annotation:1.11.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

    // Upgrade existing AndroidX runtime dependencies without introducing unused libraries.
    constraints {
        implementation 'androidx.activity:activity:1.13.0'
        implementation 'androidx.fragment:fragment:1.9.1'
        implementation 'androidx.lifecycle:lifecycle-runtime:2.11.0'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    }
}
